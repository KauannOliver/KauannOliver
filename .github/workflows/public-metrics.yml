name: Public repository metrics
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-repository-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Collect validated public totals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_metrics.py
      - name: Commit changed metrics only
        run: |
          git add -- assets/metrics.json assets/overview.svg
          if git diff --cached --quiet; then
            echo "Public totals are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh public repository metrics"
          git push
