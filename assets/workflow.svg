<text x="30" y="80" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#FFFFFF">How I build</text>
<text x="30" y="120" font-family="Arial,sans-serif" font-size="23" fill="#00D4FF">Understand → Model → Implement → Verify</text>
<text x="30" y="165" font-family="Arial,sans-serif" font-size="22" fill="#AAB3C5">Read the real workflow before writing claims.</text><text x="30" y="196" font-family="Arial,sans-serif" font-size="22" fill="#AAB3C5">Make inputs, rules and boundaries explicit.</text><text x="30" y="227" font-family="Arial,sans-serif" font-size="22" fill="#AAB3C5">Document what passed and what remains unverified.</text>
<circle cx="35" cy="340" r="4" fill="#39FF88"/><text x="48" y="345" font-family="monospace" font-size="12" fill="#AAB3C5">KAUANNOLIVER / SOURCE EXPLORER</text></svg>